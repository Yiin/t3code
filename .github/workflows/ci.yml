name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - mine

jobs:
  check:
    name: Check
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

  test:
    name: Test
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'blacksmith-8vcpu-ubuntu-2404' }}
    # The full-workspace suite takes over 10 minutes on a cold runner cache
    # (t3code-2rw); 20 gives it headroom without hiding a hang forever.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - name: Install Beads
        run: |
          go install github.com/steveyegge/beads/cmd/bd@v1.1.2
          bd --version

      - name: Test
        run: vp run test

  epic_runs:
    name: Epic Runs
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - name: Install Beads
        run: |
          go install github.com/steveyegge/beads/cmd/bd@v1.1.2
          bd --version

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run epic regression gates
        run: bash skills/cook-epic/tests/all.sh
        env:
          # This job owns the cook-epic suite: all.sh skips when bd is absent
          # (the Test job relies on that), so a missing bd here must fail.
          COOKEPIC_REQUIRE_BD: "1"

      - name: Run terminal conformance driver
        run: vp run --filter @t3tools/epic-run-conformance test
        env:
          T3CODE_CONFORMANCE_TERMINAL: "1"
